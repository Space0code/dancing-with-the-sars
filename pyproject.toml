[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarwatch"
version = "0.1.0"
description = "Parallax, a radar land-change monitor: detect changes, flag which need review (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
# Radar track: runs in the Codespace (see .devcontainer/). Exact versions get locked in requirements-radar.lock by R1.
radar = [
    "h5py>=3.10,<4", "fsspec>=2024.6", "aiohttp>=3.9,<4", "requests>=2.31,<3",
    "earthaccess>=0.11,<1", "asf_search>=8,<12", "rasterio>=1.3,<2", "shapely>=2.0,<3",
    "pyproj>=3.6,<4", "pillow>=10,<14",
]
# Verdict track: light, fine on a laptop.
verdict = ["requests>=2.31,<3", "shapely>=2.0,<3", "pyproj>=3.6,<4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
