<!doctype html>
<!-- Written by Claude -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parallax</title>
  <meta name="description" content="Land changes seen by radar satellites, labelled for review.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230a0a0a' fill-rule='evenodd' d='M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 5.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/funnel-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 5.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        <h1 id="app-name"></h1>
      </div>
      <p id="app-pitch" class="pitch"></p>
    </div>
    <div class="site-picker">
      <label for="site">Site</label>
      <select id="site"></select>
      <span id="fake-badge" class="fake-badge" hidden>Fake data</span>
    </div>
    <nav class="site-links" aria-label="Pages">
      <a href="./" aria-current="page">Map</a>
      <a href="how-it-works.html">How it works</a>
      <a href="faq.html">FAQ</a>
      <a href="about.html">About</a>
    </nav>
    <div class="actions">
      <button id="changes-btn" type="button" hidden>Changes</button>
      <button id="export-btn" type="button" hidden>Export</button>
      <button id="tour-btn" type="button" class="primary">Tour</button>
    </div>
  </header>

  <main>
    <div class="map-wrap">
      <div id="map" aria-label="Map of detected land changes"></div>
      <div id="leftpanel" class="leftpanel" data-shown="true">
        <div id="leftcard" class="leftcard" aria-label="Picture, base map, legend and records">
          <section id="viewbox" class="group" aria-label="Picture on the map" hidden>
            <p class="group-label">Picture</p>
            <div class="view-row">
              <div id="picture-switch" class="switch" role="radiogroup" aria-label="Picture">
                <button id="view-radar" type="button" role="radio" aria-checked="true">Radar</button>
                <button id="view-photo" type="button" role="radio" aria-checked="false">Satellite</button>
              </div>
              <button id="compare-btn" type="button" class="compare" aria-pressed="false">Compare</button>
            </div>
            <button id="photos-btn" type="button" class="toggle photos-toggle" aria-pressed="false" title="Dated colour photos, 30 m per pixel, instead of the sharp undated imagery" hidden><span class="knob" aria-hidden="true"></span>Dated photos</button>
            <p id="frame-label" class="frame-label" aria-live="polite"></p>
          </section>
          <div id="basemap-box" class="group basemap"></div>
          <section id="legend-box" class="group" aria-label="Legend">
            <div class="legend-head">
              <p class="group-label">Legend</p>
              <button id="overlay-btn" type="button" class="toggle" aria-pressed="true" aria-label="Marked areas"><span class="knob" aria-hidden="true"></span>Marked areas</button>
            </div>
            <ul id="legend"></ul>
          </section>
          <section id="records-box" class="group records" aria-label="Record layers" hidden></section>
        </div>
        <button id="panel-toggle" class="panel-handle" type="button" aria-expanded="true" aria-controls="leftcard" aria-label="Hide legend">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="panel-handle-text">Legend</span>
        </button>
      </div>
      <section id="tour" class="tour" aria-label="Guided tour" aria-live="polite" hidden></section>
      <section id="intro" class="intro" aria-label="Start" hidden></section>
      <p id="map-error" class="map-error" hidden></p>

      <aside id="drawer" class="drawer" aria-label="Details">
        <div class="drawer-head">
          <button id="drawer-back" type="button" class="back" hidden>&#8249; Changes</button>
          <h2 id="drawer-title"></h2>
          <button id="drawer-close" type="button" class="close" aria-label="Close">&#10005;</button>
        </div>
        <div id="drawer-tabs" class="tabs" role="tablist">
          <button id="tab-overview" type="button" role="tab" aria-selected="false" aria-controls="overview-view">Overview</button>
          <button id="tab-inbox" type="button" role="tab" aria-selected="true" aria-controls="inbox">Changes <span id="inbox-count" class="n"></span></button>
        </div>
        <div id="filter" class="filter">
          <div class="filter-row">
            <button id="filter-toggle" type="button" class="filter-toggle" aria-expanded="false" aria-controls="tools-filter"><span class="filter-name">Filter</span><span id="filter-summary" class="filter-summary"></span></button>
            <button id="filter-clear" type="button" class="link-btn" hidden>Clear</button>
          </div>
          <div id="tools-filter" hidden></div>
        </div>
        <div id="overview-view" class="view" role="tabpanel" hidden><div id="overview" class="overview"></div></div>
        <section id="inbox" class="view inbox" role="tabpanel" aria-label="Changes at this site"></section>
        <div id="card-view" class="view" hidden><p id="card-note" class="card-note" hidden>Outside the active filter. <button id="card-note-clear" type="button" class="link-btn">Clear filter</button></p><div id="card" aria-live="polite"></div></div>
      </aside>
    </div>
  </main>

  <footer class="timeline" aria-label="Timeline">
    <div class="timeline-top">
      <output id="date-label" class="date-label"></output>
      <span id="gap-note" class="gap-note" aria-live="polite"></span>
      <span id="total" class="total"></span>
    </div>
    <div class="timeline-row">
      <button id="play" class="play" type="button" aria-label="Play timeline">▶</button>
      <div class="track">
        <input id="slider" type="range" min="0" max="0" step="1" value="0" aria-label="Date">
        <div id="ticks" class="ticks"></div>
        <div id="coverage" class="coverage" hidden>
          <div class="cov-rows" aria-hidden="true"></div>
          <p id="watching" class="watching"></p>
        </div>
        <div class="range-ends"><span id="range-start"></span><span id="event-note" class="event-note"></span><span id="range-end"></span></div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
